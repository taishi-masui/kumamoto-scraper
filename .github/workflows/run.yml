name: Daily Construction Data Update

on:
  schedule:
    - cron: '15 22 * * *'  # 日本時間 朝7:15（サーバーが安定する安全な時間）
  workflow_dispatch:      # 手動実行ボタン

permissions:
  actions: write          # 👈 ★超重要：ワークフロー自身を再有効化（延命）するための公式権限
  contents: write         # 通常ファイルの書き込み用

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python main.py

      # ─── ★【安全＆公式】60日スリープをGitHub公式機能で回避する処理 ───
      - name: Keepalive Workflow (Official Way)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "Daily Construction Data Update"
