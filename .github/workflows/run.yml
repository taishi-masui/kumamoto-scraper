name: Daily Construction Data Update

on:
  schedule:
    - cron: '15 22 * * *'  # 日本時間 朝7:15（サーバーが安定する時間）
  workflow_dispatch:      # 手動実行ボタン

permissions:
  contents: write         # 通常ファイルの書き込み用

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python main.py

      # ─── ★【復活】エラーを出さずに6ヶ月スリープを永続的に回避する処理 ───
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v1
        with:
          use_api: true # 👈 コマンドではなくGitHub公式API経由で生存アピールをするため、セキュリティエラーが起きません
