name: Daily Construction Data Update

on:
  schedule:
    - cron: '15 22 * * *'  # 協定世界時(UTC)の22:15 ＝ 日本時間 朝7:15（サーバーが超安定する時間）
  workflow_dispatch:      # 手動実行ボタン

permissions:
  contents: write         # データ書き込み用の通常権限

# Node.js 20の警告を消去するための設定
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # 衝突回避のため最新の状態を取得
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python main.py
