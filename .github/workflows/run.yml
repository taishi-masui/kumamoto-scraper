name: Daily Construction Data Update

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日日本時間午前9時に実行
  workflow_dispatch:      # 手動実行ボタン

# Node.js 20の警告を消去するための設定
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # リポジトリへの書き込み（Push）権限を正しく許可
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # 衝突回避のため最新の状態を取得
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run scraper with retry
        uses: nick-fields/retry@v3
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        with:
          timeout_minutes: 120 # 1回の実行上限時間（80分以上かかるため120分に設定）
          max_attempts: 3 # 最大試行回数（初回 + リトライ2回 = 計3回）
          retry_wait_seconds: 600 # 失敗後の待ち時間（600秒 = 10分）
          command: python main.py # 実行するコマンド

      - name: Keepalive (Manual)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive (automatically committed)"
          # --force を付与して以前の衝突エラーを強制解消し、同期させる
          git push origin main --force
